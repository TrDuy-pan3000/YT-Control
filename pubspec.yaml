name: yt_control
description: A 2-in-1 Karaoke App (TV & Phone Remote).
publish_to: 'none'
version: 1.2.4+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^3.1.0
  flutter_inappwebview: ^6.0.0
  web_socket_channel: ^3.0.0
  nsd: ^3.0.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  network_info_plus: ^6.0.0
  wakelock_plus: ^1.2.0
  google_fonts: ^6.2.0
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
